<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Production analytics pipeline architecture</title>
<desc>Seven-stage pipeline: Raw sources, Staging, Clean, Golden, Feature, Metrics, Dashboard, showing data flow from source systems to the executive dashboard.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="60" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="105" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Raw</text>
<text x="105" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">17 source tables</text>

<rect x="190" y="60" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="255" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Staging</text>
<text x="255" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Typed, landed</text>

<rect x="340" y="60" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="405" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Clean</text>
<text x="405" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Deduped, validated</text>

<rect x="490" y="60" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="555" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Golden</text>
<text x="555" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Documented rules</text>

<line x1="170" y1="88" x2="188" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="88" x2="338" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470" y1="88" x2="488" y2="88" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M555 116 L555 145 L190 145 L190 168" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="125" y="168" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="190" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Feature</text>
<text x="190" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Derived signals</text>

<rect x="275" y="168" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Metrics</text>
<text x="340" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Rate-normalized</text>

<rect x="425" y="168" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="490" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Dashboard</text>
<text x="490" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">One CEO screen</text>

<line x1="255" y1="196" x2="273" y2="196" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="405" y1="196" x2="423" y2="196" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
